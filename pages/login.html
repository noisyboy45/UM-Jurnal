<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="icon" href="../assets/icons/UM_icon.png">
    <link rel="stylesheet" href="../styles/output.css">
</head>

<body>
    <main class="flex flex-row w-full h-screen overflow-clip">
        <div class="bg-gradient-to-b from-[#74BFDF] to-[#0A5E82] max-sm:hidden p-2  w-full h-full">
            <div class="absolute flex flex-col justify-center items-center top-1/2 left-1/4 -translate-1/2">
                <div class="flex flex-row max-sm:hidden justify-center items-center mb-8">
                    <img class="h-10" src="../assets/icons/UM_icon.png" alt="">
                    <span class="ml-4 text-sm text-white font-semibold">UM Jurnal</span>
                </div class->
                <img class="h-70" src="../assets/images/web-in-device.png" alt="">
                <div class="w-150 h-2 mt-3 rounded-full bg-black blur-[20px] shadow-[0_0_50px_rgba(0,0,0,1)]">
                </div>
            </div>
        </div>
        <div class="w-full ">
            <div class="h-full w-full max-w-150 px-20 max-sm:px-3 py-14 max-sm:py-7">
                <div class="flex flex-row items-center mb-12">
                    <img class="w-15 object-cover" src="../assets/icons/UM_icon.png" alt="UM logo">
                    <span class="ml-5 text-lg font-bold">UM Jurnal</span>
                </div>
                <h1 class="text-5xl font-bold text-[#2080A9] mb-1">Login</h1>
                <span class="block text-sm font-montserrat text-[#525252] mb-8">Login untuk kebebasan dalam mencari
                    riset,
                    jurnal, artikel, buku dan karya ilmiah</span>
                <form class="flex flex-col gap-1">
                    <label class="text-sm font-bold" for="email">Email</label>
                    <input class="focus:outline-none border-[#B3B3B3] px-2 py-0.5 border-2 w-full h-8 rounded-sm"
                        type="email" name="email" id="email" required>
                    <label class="text-sm font-bold" for="password">Kata Sandi</label>
                    <input class="focus:outline-none border-[#B3B3B3] px-2 py-0.5 border-2 w-full h-8 rounded-sm"
                        type="password" name="password" id="password" required>
                    <button type="submit"
                        class="bg-[#459EC5] cursor-pointer flex items-center justify-center rounded-lg text-lg text-white font-bold w-full h-10 mt-4 mb-8">Login</button>
                </form>
                <div class="flex justify-center text-sm"><span>Jika belum memiliki akun klik</span><a
                        class="text-[#56B1D8] cursor-pointer underline ml-1.5" href="daftar.html">Daftar</a>
                </div>
            </div>
        </div>
    </main>
    <script>
    document.querySelector('form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password }),
            });
            const json = await res.json();
            if (json.success) {
                localStorage.setItem('token', json.data.token);
                localStorage.setItem('user', JSON.stringify(json.data.user));
                alert(json.message);
                window.location.href = '../pages/user/dashboard.html';
            } else {
                alert(json.message);
            }
        } catch(err) {
            alert('Terjadi kesalahan. Silakan coba lagi.');
        }
    });
    </script>
    <script src="../script/script.js"></script>
</body>

</html>
